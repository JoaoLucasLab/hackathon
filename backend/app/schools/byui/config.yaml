# BYU-Idaho school rules (ENG-05). Read by schools/byui/rules.py.
# Change values here, not in code: the engine picks them up with no code change.

university_id: byui

# Rate My Professors school id, looked up once by hand (Nov 14, 2026): the school's
# page there is /school/1754. Used only to build a plain search link the student
# opens in their browser; the backend never requests that site (DATA-05).
rmp_school_id: "1754"

# Credit range used when the student gives none.
credit_default_min: 12
credit_default_max: 15
# Highest maximum the relaxation step may suggest.
credit_max_limit: 18

# Term code season suffix ("2027;WI", "2027;WI;W1") -> season name.
term_seasons:
  FA: fall
  WI: winter
  SP: spring

# Campus students have a two-semester track. Off-track semesters allow only
# online sections. The `online` track has no on-track semester: online only.
tracks:
  fall_winter: [fall, winter]
  winter_spring: [winter, spring]
  spring_fall: [spring, fall]
  online: []

religion:
  subjects: [REL]
  max_at_registration: 1
  note: "You can add a second religion course after the first day of the semester."

waitlist:
  max_credits: 12

audit_max_age_days: 30

# Score weights. Each is points per unit:
#   requirement         per unmet audit requirement the schedule fills
#   credit              per credit
#   preference          per preference met (see engine/explain.py keys)
#   favorite_professor  per class taught by a favorite professor
#   open_seats          per class, times the share of seats still open
#   unlocks             per other remaining requirement a class is a prerequisite for
#   gap_per_hour        subtracted per hour of idle time between classes in a day
weights:
  requirement: 100
  credit: 1
  preference: 5
  favorite_professor: 20
  open_seats: 3
  unlocks: 15
  gap_per_hour: 4

# When nothing fits, these constraints are loosened one at a time, in this order.
# The first one that gives schedules is suggested. Exclusions the student typed
# (exclude_courses, exclude_section_ids) are never loosened.
relaxation_order:
  - only_favorite_professors
  - earliest_start
  - latest_end
  - days_off
  - delivery_methods
  - allow_waitlist
  - only_required
  - credit_min
  - credit_max
  - include_courses

# Mentor ranking (ENG-06). Points per unit, by goal:
#   topic_overlap    per requested topic tag that is on the professor's profile
#   took_class       per audit class with this professor passed at min_grade or better
#   teaches_winter   once, when the professor teaches a Winter course whose
#                    title or description names a requested tag
#   lists_research   once, when the profile lists undergraduate research
# For "recommendation letter", took_class must stay above the most a pure topic
# match can score (8 tags x topic_overlap + teaches_winter), so a
# professor the student took a class with ranks first. A test checks it.
mentors:
  max_results: 5
  min_grade: B
  # Best to worst. A grade not listed here (P, W, I) never counts as passed.
  grade_scale: [A, A-, B+, B, B-, C+, C, C-, D+, D, D-, F]
  weights:
    research:
      topic_overlap: 20
      took_class: 10
      teaches_winter: 10
      lists_research: 15
    recommendation letter:
      topic_overlap: 5
      took_class: 100
      teaches_winter: 4
      lists_research: 0
    TA job:
      topic_overlap: 10
      took_class: 40
      teaches_winter: 15
      lists_research: 0
    internship referral:
      topic_overlap: 10
      took_class: 25
      teaches_winter: 5
      lists_research: 0
