# ENG-01: contract checks. Kept separate from DATA-01's ci.yml to avoid merge
# conflicts; DATA-01 may fold these steps into ci.yml.
name: contracts

on:
  pull_request:
  push:
    branches: [main]

jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: mypy backend
      # Tests marked `live` are skipped by pytest's addopts in pyproject.toml.
      # Not listed yet: test_explain_grounded.py (AI-03). It fails on main: its recorded
      # Claude replies are named stub-1..3, but ENG-03 now gives real schedule ids. The
      # AI & Product owner re-records them (test_record_live_explanations, by hand with an
      # API key); then replace this list with `pytest backend/tests`.
      - run: >-
          pytest
          backend/tests/test_contracts.py
          backend/tests/test_fixtures_valid.py
          backend/tests/test_layering.py
          backend/tests/test_schedule_importer.py
          backend/tests/test_populate_db.py
          backend/tests/test_schedule_string.py
          backend/tests/test_course_code.py
          backend/tests/test_conflicts.py
          backend/tests/test_candidates.py
          backend/tests/test_solver_small.py
          backend/tests/test_solver_properties.py
          backend/tests/test_prereq_parser.py
          backend/tests/test_prereq_evaluator.py
          backend/tests/test_prereq_fallback.py
          backend/tests/test_chat_loop.py
          backend/tests/test_constraints_from_chat.py
          backend/tests/test_grounding.py
          backend/tests/test_llm_client.py
          backend/tests/test_tools_schema.py
          backend/tests/test_favorites.py
      - name: Generated TypeScript types are up to date
        working-directory: frontend
        run: |
          npm ci
          npm run gen:types
          git diff --exit-code -- src/api/types.ts || {
            echo "::error::frontend/src/api/types.ts is out of date. Run 'npm run gen:types' and commit it."
            exit 1
          }
