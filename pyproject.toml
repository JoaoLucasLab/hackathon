# DATA-01 owns this file. ENG-01 created the first version.
[project]
name = "course-planner"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.16,<2",
  "anthropic>=2.8,<3",
  # Read-only access to the catalog in Postgres (app/api/catalog_data.py).
  "psycopg[binary]>=3.2,<4",
  "ortools>=9.10,<10",
  "fastapi>=0.115",
  "pydantic>=2.9",
  "python-multipart>=0.0.9",
  "pyyaml>=6",
  # Students and sessions (app/db/). The driver is psycopg, picked in app/db/engine.py.
  "sqlalchemy>=2.0,<3",
  "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = [
  "pytest>=8", "httpx>=0.27", "ruff>=0.6", "mypy>=1.11", "types-PyYAML",
  # scripts/scrape_faculty.py's parser, tested offline on fixtures/html/ (DATA-05).
  "beautifulsoup4>=4.12",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["backend"]
include = ["app*"]

[tool.setuptools.package-data]
app = ["llm/prompts/*.md", "schools/byui/*.yaml"]

# `alembic upgrade head` / `alembic downgrade base`, run from the repo root (`make migrate`)
# or from /app in the backend container. The database comes from DATABASE_URL (env.py).
[tool.alembic]
script_location = "%(here)s/backend/app/db/migrations"

[tool.pytest.ini_options]
pythonpath = ["backend"]
testpaths = ["backend/tests"]
markers = ["live: hits a real external API; run by hand only"]
addopts = "-m 'not live'"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# Migrations hold SQL with aligned end-of-line comments (moved as is from schema.sql).
"backend/app/db/migrations/versions/*" = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.mypy]
python_version = "3.12"
mypy_path = "backend"
explicit_package_bases = true
plugins = ["pydantic.mypy"]
strict = true
