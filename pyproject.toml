# Minimal version created by ENG-01 because the DATA-01 skeleton was not merged yet.
# DATA-01 owns this file and adds the database dependencies.
[project]
name = "course-planner"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "anthropic>=2.8,<3",
  "fastapi>=0.115",
  "pydantic>=2.9",
  "python-multipart>=0.0.9",
  "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.6", "mypy>=1.11"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["backend"]
include = ["app*"]

[tool.setuptools.package-data]
app = ["llm/prompts/*.md"]

[tool.pytest.ini_options]
pythonpath = ["backend"]
testpaths = ["backend/tests"]
markers = ["live: hits a real external API; run by hand only"]
addopts = "-m 'not live'"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.mypy]
python_version = "3.12"
mypy_path = "backend"
explicit_package_bases = true
plugins = ["pydantic.mypy"]
strict = true
